<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ROCKETBALL: throw a touchdown. Kick a goal. Hit a home run. Then steer it with a rocket." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>ROCKETBALL</title>
    <!-- HaveAnApp Pulse: anonymous, cookieless usage counts. -->
    <script defer src="https://haveanapp-pulse-collect.vercel.app/p.js" data-app="rocketball"></script>
    <script>window.pulse=window.pulse||function(){(pulse.q=pulse.q||[]).push(arguments)}</script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" role="application" aria-label="ROCKETBALL play field. Touch or mouse: drag, swipe or tap to launch, then hold to boost and drag up or down to steer. Keyboard: arrows to aim, Space to launch and boost, P to pause, R to retry."></canvas>
      <div id="ui"></div>
      <div id="safe-probe" aria-hidden="true"></div>
    </div>
    <noscript>ROCKETBALL needs JavaScript to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
